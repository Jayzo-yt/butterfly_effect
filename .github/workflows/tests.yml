name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/ -q

      # Most modules carry a runnable self-check as well as their tests.
      - name: Module self-checks
        run: |
          python -m src.graph.areas
          python -m src.graph.dependencies
          python -m src.analysis.provenance
          python -m src.analysis.incidents
          python -m src.analysis.cascade
          python -m src.analysis.comparison
          python -m src.analysis.actions
          python -m src.analysis.response
          python -m src.analysis.occupancy
          python -m src.analysis.recovery
          python -m src.analysis.scenario

      # The committed extract has to stay clean: no self-loops, no dangling
      # edges, no duplicate assets.
      - name: Validate the committed city data
        run: python scripts/validate_city.py data/city/manipal.json

      # The six reference scenarios must all run against the real extract.
      - name: Reference scenarios
        run: python scripts/run_scenarios.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
